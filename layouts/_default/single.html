{{ define "main" }}
<div class="guide-layout{{ if and (not .IsHome) .TableOfContents }} guide-layout--with-toc{{ end }}">
  {{ partial "sidebar.html" . }}
  <article class="guide-content">
    <h1 class="chapter-title">{{ .Title }}</h1>
    <div class="chapter-body">
      {{ .Content }}
    </div>
    {{ partial "prev-next.html" . }}
  </article>
  {{ partial "toc.html" . }}
</div>
{{ end }}
